<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quirkzy — Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================
         LOGIN PAGE
    ========================================== -->

    <main class="login-page">

        <div class="login-card">

            <!-- Logo -->

            <a
                href="index.html"
                class="login-logo"
            >
                Quirkzy
            </a>


            <!-- Intro -->

            <p class="login-label">
                WELCOME BACK
            </p>

            <h1>
                Come on in.
            </h1>

            <p class="login-subtitle">
                Log in to keep your quirks,
                orders and reviews in one place.
            </p>


            <!-- =========================================
                 LOGIN FORM
            ========================================== -->

            <form id="login-form">

                <!-- Email -->

                <label for="login-email">
                    Email
                </label>

                <input
                    type="email"
                    id="login-email"
                    placeholder="you@example.com"
                    required
                >


                <!-- Password -->

                <label for="login-password">
                    Password
                </label>

                <input
                    type="password"
                    id="login-password"
                    placeholder="Your password"
                    required
                >


                <!-- Submit -->

                <button
                    type="submit"
                    class="login-button"
                >
                    Log in →
                </button>

            </form>


            <!-- Signup -->

            <p class="login-switch">

                Don't have an account?

                <a
                    href="#"
                    id="show-signup"
                >
                    Create one
                </a>

            </p>


            <!-- Login message -->

            <p id="login-message"></p>

        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
