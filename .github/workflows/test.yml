name: Quirkzy tests

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quirkzy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quirkzy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quirkzy_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quirkzy_test
      JWT_SECRET: test-secret-that-is-long-enough-for-ci-123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm test
